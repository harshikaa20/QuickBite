<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickBite | Checkout</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #faf6ef;
            color: #44352c;
            min-height: 100vh;
        }

        /* NAVBAR */

        nav {
            height: 75px;
            background: #fffdf9;
            border-bottom: 1px solid #e7d9ca;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            font-size: 29px;
            font-weight: 750;
            color: #60402f;
            letter-spacing: 1px;
        }

        .logo span {
            color: #c4935b;
        }

        .back {
            text-decoration: none;
            color: #6b4632;
            font-size: 14px;
        }

        /* PAGE */

        .page {
            width: 86%;
            max-width: 1100px;
            margin: 50px auto 80px;
        }

        .eyebrow {
            color: #b17a4b;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        h1 {
            font-size: 40px;
            color: #49372d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #81746a;
            margin-bottom: 35px;
        }

        /* GRID */

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.8fr;
            gap: 30px;
        }

        /* CARD */

        .card {
            background: #fffdf9;
            border: 1px solid #e7d9ca;
            border-radius: 25px;
            padding: 30px;

            box-shadow:
                    0 12px 35px rgba(70,45,30,0.07);
        }

        .card h2 {
            color: #49372d;
            font-size: 22px;
            margin-bottom: 25px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #66564b;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;

            border: 1px solid #dfd0c1;

            background: #fffaf4;

            border-radius: 12px;

            padding: 13px;

            font-size: 14px;

            color: #4d382d;

            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #b98a61;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* PAYMENT */

        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 15px;

            border: 1px solid #e3d5c7;

            border-radius: 13px;

            margin-bottom: 12px;

            background: #fffaf5;
        }

        .payment-option input {
            width: auto;
        }

        .payment-option label {
            margin: 0;
            font-weight: 500;
        }

        /* SUMMARY */

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 12px 0;

            color: #77685d;

            font-size: 14px;
        }

        .summary-row strong {
            color: #5d493c;
        }

        .free {
            color: #69825a !important;
        }

        .divider {
            border: none;
            border-top: 1px solid #e5d8cb;
            margin: 15px 0;
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 10px;
        }

        .total span:first-child {
            font-size: 18px;
            font-weight: 700;
            color: #49372d;
        }

        .total span:last-child {
            font-size: 25px;
            font-weight: 750;
            color: #60402f;
        }

        /* BUTTON */

        .place-order {
            width: 100%;

            border: none;

            background: #6b4632;

            color: white;

            padding: 16px;

            border-radius: 30px;

            margin-top: 25px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .place-order:hover {
            background: #4f3022;
            transform: translateY(-2px);
        }

        .secure {
            text-align: center;
            color: #9a8b80;
            font-size: 11px;
            margin-top: 15px;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 500px) {

            .page {
                width: 92%;
            }

            h1 {
                font-size: 32px;
            }

            .card {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        Quick<span>Bite</span>
    </div>

    <a href="/cart"
       class="back">

        ← Back to Cart

    </a>

</nav>



<!-- PAGE -->

<div class="page">

    <div class="eyebrow">
        QuickBite Checkout
    </div>

    <h1>
        Almost there ✨
    </h1>

    <p class="subtitle">
        Complete your details and we'll get your food ready.
    </p>



    <div class="checkout-grid">


        <!-- ========================================= -->
        <!-- CUSTOMER DETAILS -->
        <!-- ========================================= -->

        <div class="card">

            <h2>
                Delivery Details
            </h2>


            <form
                    action="/order/place"
                    method="post">


                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                            type="text"
                            name="customerName"
                            placeholder="Enter your name"
                            required>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                            type="tel"
                            name="phone"
                            placeholder="Enter your phone number"
                            required>

                </div>



                <!-- ADDRESS -->

                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                            name="address"
                            placeholder="Enter your complete delivery address"
                            required></textarea>

                </div>



                <!-- PAYMENT -->

                <h2 style="margin-top:30px;">
                    Payment Method
                </h2>


                <div class="payment-option">

                    <input
                            type="radio"
                            id="cod"
                            name="paymentMethod"
                            value="Cash on Delivery"
                            checked>

                    <label for="cod">

                        💵 Cash on Delivery

                    </label>

                </div>


                <div class="payment-option">

                    <input
                            type="radio"
                            id="online"
                            name="paymentMethod"
                            value="Online Payment">

                    <label for="online">

                        💳 Online Payment

                    </label>

                </div>



                <!-- PLACE ORDER -->

                <button
                        type="submit"
                        class="place-order">

                    Place My Order ✨

                </button>


            </form>


            <div class="secure">

                🔒 Your information is handled securely.

            </div>

        </div>



        <!-- ========================================= -->
        <!-- ORDER SUMMARY -->
        <!-- ========================================= -->

        <div class="card">

            <h2>
                Order Summary
            </h2>


            <div class="summary-row">

                <span>
                    Items
                </span>

                <strong
                        th:text="${cartItems != null ? cartItems.size() : 0}">

                    0

                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong>

                    ₹<span
                        th:text="${grandTotal != null ? grandTotal : 0}">

                        0

                    </span>

                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <strong class="free">

                    FREE

                </strong>

            </div>


            <hr class="divider">


            <div class="total">

                <span>
                    Total
                </span>

                <span>

                    ₹<span
                        th:text="${grandTotal != null ? grandTotal : 0}">

                        0

                    </span>

                </span>

            </div>


        </div>


    </div>

</div>


</body>

</html>
